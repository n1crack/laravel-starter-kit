name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug
          # php-code-coverage 14 counts assert() calls as executable lines, so
          # they must actually run for coverage to reach 100%. setup-php uses
          # php.ini-production by default, where zend.assertions is -1.
          ini-values: zend.assertions=1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install Node Dependencies
        run: npm install

      - name: Build Assets
        run: npm run build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm list playwright --depth=0 --json | jq -er '.dependencies.playwright.version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Rector Cache
        uses: actions/cache@v6
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-rector-
      - run: mkdir -p /tmp/rector

      - name: PHPStan Cache
        uses: actions/cache@v6
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-phpstan-
      - run: mkdir -p /tmp/phpstan

      - name: Tests
        run: composer test

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: browser-screenshots
          path: |
            tests/Browser/Screenshots

  # The stub trees under `stubs/` are never executed by the kit's own suite —
  # only their publishing and patching is. This installs each optional feature
  # into a scratch checkout and runs the resulting application's tests, so the
  # generated code cannot rot unnoticed.
  install:
    runs-on: ubuntu-latest

    # Only on the way into main. A pull request gets the `ci` job alone, which
    # keeps a review down to one runner while other repositories are competing
    # for the same twenty. The cost is that a broken install shows up on main
    # rather than on the pull request that caused it.
    if: github.event_name == 'push'

    strategy:
      fail-fast: false

      # A Free plan allows 20 concurrent jobs across the whole account, and
      # this matrix would claim six of them at once while other repositories
      # are waiting for the same pool. Two at a time costs wall-clock here and
      # leaves room everywhere else.
      max-parallel: 2

      matrix:
        include:
          - name: default
            options: --no-interaction
          - name: teams
            options: --teams --no-interaction
          - name: react-public
            options: --public=react --no-interaction
          - name: react-public-and-teams
            options: --public=react --teams --no-interaction
          - name: tenancy
            options: --tenancy --central-domain=localhost --no-interaction
          - name: everything
            options: --tenancy --teams --public=react --central-domain=localhost --no-interaction
            browser: true

    name: install (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          ini-values: zend.assertions=1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install the starter kit
        run: php artisan starter-kit:install ${{ matrix.options }}

      # Installing changes the dependency set: the React public pages drop
      # Livewire and tenancy adds stancl/tenancy. Scripts are skipped so the
      # kit's `update:requirements` hook does not bump every dependency mid-run.
      - name: Refresh Dependencies
        run: |
          composer update --no-interaction --prefer-dist --no-scripts
          php artisan package:discover
          npm install

      - name: Build Assets
        run: npm run build

      # The kit's own linters never see `stubs/`, so the generated application
      # is where the stub code first meets Pint, Rector and PHPStan. Without
      # this a fresh install could ship a red `composer test`.
      - name: Lint the generated application
        run: |
          vendor/bin/pint --test
          vendor/bin/rector --dry-run
          vendor/bin/phpstan analyse --no-progress

      # Only one combination drives a browser. It is the one that installs
      # everything, so it covers the most surface, and the other five are
      # spared a browser download they would only repeat.
      - name: Get Playwright version
        if: matrix.browser
        id: playwright-version
        run: echo "version=$(npm list playwright --depth=0 --json | jq -er '.dependencies.playwright.version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        if: matrix.browser
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ steps.playwright-version.outputs.version }}

      # The headless shell is roughly half the size of full Chromium, and the
      # suite never runs headed.
      - name: Install Playwright Browsers
        if: matrix.browser && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright System Dependencies
        if: matrix.browser && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test the generated application
        run: vendor/bin/pest --type-coverage --min=100

      # A page answering 200 says nothing about whether its form submits.
      - name: Test the generated application in a browser
        if: matrix.browser
        run: php artisan test

      - name: Test the generated application without a browser
        if: '!matrix.browser'
        run: php artisan test --testsuite=Feature,Unit
